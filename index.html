<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akshathdayan Suresh | Digital Marketing & Brand Strategy</title>
    <meta name="description" content="Portfolio of Akshathdayan Suresh. Business Management graduate with experience across digital marketing, global events, marketing analytics, and brand strategy based in Toronto, Canada." />
    <meta name="keywords" content="Akshathdayan, Akshath Dayan, Akshathdayan Suresh, Akshath Dayan Suresh, Portfolio, Digital Marketing, Brand Strategy, Toronto" />
    <meta name="theme-color" content="#0C0C0B" />
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Akshathdayan Suresh | Digital Marketing & Brand Strategy" />
    <meta property="og:description" content="Portfolio of Akshathdayan Suresh. Business Management graduate with experience across digital marketing, global events, marketing analytics, and brand strategy." />
    <meta property="og:url" content="https://www.akshathdayansuresh.com/" /> 
    <!-- Absolute URLs: LinkedIn, iMessage, Slack and most link-preview scrapers ignore a relative image path -->
    <meta property="og:image" content="https://www.akshathdayansuresh.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Akshathdayan Suresh | Digital Marketing & Brand Strategy" />
    <meta name="twitter:description" content="Portfolio of Akshathdayan Suresh. Business Management graduate with experience across digital marketing, global events, marketing analytics, and brand strategy." />
    <meta name="twitter:image" content="https://www.akshathdayansuresh.com/og-image.png" />

    <!-- SITE NAME — the label Google shows above the URL in search results.
         Google reads it mainly from the WebSite structured data below, and only uses it when the
         name is consistent and reads like a name: it rejected "Akshathdayan - Portfolio" (a title
         with a separator) and fell back to the bare domain. Keep these two identical, with no
         separators. Google applies a change after it re-crawls the homepage. -->
    <meta property="og:site_name" content="Akshathdayan Portfolio" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Akshathdayan Portfolio",
      "alternateName": ["Akshathdayan Suresh", "Akshathdayan Suresh Portfolio", "Akshath Dayan Suresh"],
      "url": "https://www.akshathdayansuresh.com/"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
